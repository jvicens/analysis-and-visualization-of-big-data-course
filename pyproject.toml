[project]
name = "avbd-course"
version = "2026.1"
description = "Materials for Analysis and Visualization of Big Data (UB, MSc Physics of Complex Systems and Biophysics)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.1",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "scipy>=1.14",
    "geopandas>=1.1",
    "pyogrio>=0.10",
    "shapely>=2.1",
    "pyarrow>=18",
    "plotly>=6",
    "bokeh>=3.6",
    "jupyterlab>=4.3",
    "ipykernel>=6.29",
    "openpyxl>=3.1",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "sodapy>=2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "nbstripout>=0.8",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "nbmake>=1.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
